esphome:
  name: ir-bedroom

esp8266:
  board: esp_wroom_02

wifi:
  ssid: ''            #Enter wifi ssid
  password:           #Enter wiwi password
  fast_connect: true

logger:

api:
  password: ''        #Enter api password
  services:
    - service: control
      variables:
        hvac: string
        temp: float
        fan: string
        swing: string
      then:
        - lambda: |-
            id(bedroom_ac).make_call()
              .set_mode(hvac)
              .set_target_temperature(temp)
              .set_fan_mode(fan)
              .set_swing_mode(swing)
              .perform();

ota:
  password: ''        #Enter ota password

status_led:
  pin: GPIO4

remote_receiver:
  pin: 
    number: GPIO5
    inverted: true
  dump: all

remote_transmitter:
  pin: 
    number: GPIO14
    inverted: false
  carrier_duty_percent: 50%
  id: "ir_bedroom_transmitter"
    
climate:
  - platform: gree
    name: "Bedroom AC"
    id: "bedroom_ac"
    sensor: current_temperature
    model: yan

sensor:
  - platform: homeassistant
    id: current_temperature
    entity_id: sensor.temperature       #Your HA temperature sensor

binary_sensor:
- platform: gpio
  pin:
    number: GPIO13
    inverted: true
  internal: true
  name: "ir_bedroom_button"
  id: "ir_bedroom_button"